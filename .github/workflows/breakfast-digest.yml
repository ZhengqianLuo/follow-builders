name: AI Builders Breakfast Digest

on:
  schedule:
    # 23:30 UTC = 07:30 Asia/Shanghai.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      preview_today_sent:
        description: "Resend today's already-sent items as a preview without updating sent state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      FOLLOW_BUILDERS_CONFIG: config/github-actions.json
      FOLLOW_BUILDERS_STATE: config/github-actions-state.json
      POST_FILE: /tmp/follow-builders-digest-post.json
      RECORD_FILE: /tmp/follow-builders-digest-record.json
      PREVIEW_STATE_FILE: /tmp/follow-builders-preview-state.json
      SUMMARY_CACHE_FILE: config/llm-summary-cache.json
      PREVIEW_TODAY_SENT: ${{ inputs.preview_today_sent || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        run: npm ci
        working-directory: scripts

      - name: Build Feishu post digest
        id: build
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          FOLLOW_BUILDERS_SUMMARY_CACHE: ${{ env.SUMMARY_CACHE_FILE }}
        run: |
          if [ "$PREVIEW_TODAY_SENT" = "true" ]; then
            node -e '
              const fs = require("fs");
              const source = JSON.parse(fs.readFileSync(process.env.FOLLOW_BUILDERS_STATE, "utf8"));
              const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai" }).format(new Date());
              const state = { version: 1, sent: {} };
              for (const [key, value] of Object.entries(source.sent || {})) {
                const sentDate = value.sentAt
                  ? new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai" }).format(new Date(value.sentAt))
                  : "";
                if (sentDate !== today) state.sent[key] = value;
              }
              fs.writeFileSync(process.env.PREVIEW_STATE_FILE, JSON.stringify(state, null, 2) + "\n");
            '
            export FOLLOW_BUILDERS_STATE="$PREVIEW_STATE_FILE"
          fi
          node scripts/build-digest.js --format post --record-file "$RECORD_FILE" > "$POST_FILE"
          if [ ! -s "$POST_FILE" ]; then
            echo "has_digest=false" >> "$GITHUB_OUTPUT"
            echo "No new digest items to send."
            exit 0
          fi
          echo "has_digest=true" >> "$GITHUB_OUTPUT"

      - name: Send digest to Feishu
        if: steps.build.outputs.has_digest == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL || secrets.FEISHU_AI_BUILDER }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::Missing GitHub Actions secret FEISHU_WEBHOOK_URL"
            exit 1
          fi
          node scripts/deliver.js --post-file "$POST_FILE"

      - name: Mark digest items as sent
        if: steps.build.outputs.has_digest == 'true' && env.PREVIEW_TODAY_SENT != 'true'
        run: node scripts/build-digest.js --mark-sent "$RECORD_FILE"

      - name: Commit sent-state update
        if: steps.build.outputs.has_digest == 'true' && env.PREVIEW_TODAY_SENT != 'true'
        run: |
          if git diff --quiet -- "$FOLLOW_BUILDERS_STATE" "$SUMMARY_CACHE_FILE"; then
            echo "No sent-state or summary-cache changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FOLLOW_BUILDERS_STATE" "$SUMMARY_CACHE_FILE"
          git commit -m "chore: update breakfast digest sent state"
          git push
